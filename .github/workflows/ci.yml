name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  APP_DIR: .

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: shopflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://shopflow:ci-test-password@localhost:5432/shopflow
      REDIS_URL: redis://localhost:6379/0
      PORT: "5000"
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (fails on serious errors)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (style, informational)
        run: flake8 . --count --exit-zero --statistics

      - name: Run tests
        run: pytest -v

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r ${{ env.APP_DIR }}/backend/requirements.txt

      - name: Source scan (Trivy filesystem)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_DIR }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build-scan:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t shopflow-backend:ci ${{ env.APP_DIR }}/backend

      - name: Build frontend image
        run: docker build -t shopflow-frontend:ci ${{ env.APP_DIR }}/frontend

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: shopflow-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: shopflow-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
