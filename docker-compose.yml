services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - mynetwork
    ports:
      - "6378:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    networks:
      - mynetwork
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    image: shopflow-backend:${APP_VERSION:-1.0.0}
    container_name: backend
    restart: always
    networks:
      - mynetwork
    ports:
      - "5000:5000"
    env_file:
      - ./backend/config.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: shopflow-frontend:${APP_VERSION:-1.0.0}
    container_name: frontend
    restart: always
    networks:
      - mynetwork
    ports:
      - "8080:8080"
    depends_on:
      - backend

networks:
  mynetwork:

volumes:
  pgdata:
