apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Minicvictor/shopflow-devops-capstone.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: shopflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend-blue
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: backend-green
      jsonPointers:
        - /spec/replicas
