apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: shopflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: shopflow
automountServiceAccountToken: false
---
# Read-only access for people or tools that only need to look
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopflow-viewer
  namespace: shopflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shopflow-viewer
  namespace: shopflow
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shopflow-viewer
  namespace: shopflow
subjects:
  - kind: ServiceAccount
    name: shopflow-viewer
    namespace: shopflow
roleRef:
  kind: Role
  name: shopflow-viewer
  apiGroup: rbac.authorization.k8s.io

