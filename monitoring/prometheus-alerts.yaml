apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: shopflow
        rules:
          - alert: BackendDown
            expr: (sum(up{job="shopflow-backend"}) or vector(0)) < 1
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "No ShopFlow backend pods are being scraped"
          - alert: HighErrorRate
            expr: sum(rate(flask_http_request_total{status=~"5.."}[2m])) / sum(rate(flask_http_request_total[2m])) > 0.05
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "More than 5% of requests are returning 5xx"
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)) > 1
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "p95 request latency is above 1 second"
          - alert: PodRestartingFrequently
            expr: increase(kube_pod_container_status_restarts_total{namespace="shopflow"}[10m]) > 2
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.pod }} restarted more than twice in 10 minutes"
          - alert: PodNotReady
            expr: kube_pod_status_ready{namespace="shopflow",condition="true"} == 0
            for: 2m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.pod }} has not been ready for 2 minutes"
      - name: shopflow-slo
        rules:
          - record: sli:availability:ratio_rate5m
            expr: sum(rate(flask_http_request_total{status!~"5.."}[5m])) / sum(rate(flask_http_request_total[5m]))
          - record: sli:availability:ratio_rate1h
            expr: sum(rate(flask_http_request_total{status!~"5.."}[1h])) / sum(rate(flask_http_request_total[1h]))
          - record: sli:latency_under_500ms:ratio_rate5m
            expr: sum(rate(flask_http_request_duration_seconds_bucket{le="0.5"}[5m])) / sum(rate(flask_http_request_duration_seconds_count[5m]))
          - alert: ErrorBudgetFastBurn
            expr: (1 - sli:availability:ratio_rate1h) / 0.005 > 6
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "Availability error budget is burning more than 6x faster than allowed"
